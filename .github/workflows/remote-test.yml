name: macOS VNC
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Enable macOS VNC Screen Sharing
        run: |
          # 1. Create a brand new admin user for our VNC connection
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "123456" -admin
          
          # 2. Explicitly whitelist 'vncuser' for remote access
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -allowAccessFor -specifiedUsers
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -users vncuser -access -on -privs -all
          
          # 3. Bypass macOS TCC (Screen Recording & Accessibility) blocks
          # Because SIP is disabled on GitHub runners, we can inject permissions directly
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('kTCCServiceScreenCapture', 'com.apple.screensharing.agent', 0, 2, 4, 1);"
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('kTCCServiceAccessibility', 'com.apple.screensharing.agent', 0, 2, 4, 1);"
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('kTCCServicePostEvent', 'com.apple.screensharing.agent', 0, 2, 4, 1);"
          
          # 4. Start the VNC server with legacy password fallback
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -clientopts -setvnclegacy -vnclegacy yes -clientopts -setvncpw -vncpw 123456 -restart -agent
          
      - name: Install Ngrok
        run: brew install ngrok/ngrok/ngrok
        
      - name: Start Ngrok and Keep Alive
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          # Start Ngrok in the background
          ngrok tcp 5900 --authtoken $NGROK_TOKEN --log=stdout > ngrok.log &
          
          # Wait a few seconds for Ngrok to initialize
          sleep 5
          
          # Print the connection address
          echo "=========================================="
          echo "Connect to VNC using this address (CHANGE tcp:// TO vnc://):"
          curl -s http://localhost:4040/api/tunnels | grep -Eo "tcp://[a-zA-Z0-9.-]+:[0-9]+"
          echo "Username: vncuser"
          echo "Password: 123456"
          echo "=========================================="
          
          # Keep the runner alive for 6 hours (maximum limit)
          sleep 21600
