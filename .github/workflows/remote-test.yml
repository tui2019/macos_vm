name: Interactive macOS 26 Session
on: [workflow_dispatch]

jobs:
  interactive:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Screen Sharing (VNC)
        run: |
          # Enable Screen Sharing / Remote Management
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCLegacyConnectionsAllowed -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement ARD_AllLocalUsers -bool true
          
          # DEBUG: Print TCC schema to find correct columns
          TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          echo "Checking TCC Schema..."
          sudo sqlite3 "$TCC_DB" ".schema access"
          
          # TCC Bypass Attempt (Generic columns found in most modern macOS)
          SERVICE="kTCCServiceScreenCapture"
          CLIENT="com.apple.RemoteManagement.ARDAgent"
          sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('$SERVICE', '$CLIENT', 0, 1, 4, 1);"
          sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('kTCCServiceScreenCapture', 'com.apple.RemoteManagement.RemoteManagementErrors', 0, 1, 4, 1);"

          # Kickstart Remote Management
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -restart -agent -privs -all
          
          # Set VNC-specific password (Legacy mode)
          # This works independently of the user account's secure token
          echo "Mypassword123!" | sudo tee /etc/vncpasswd
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes \
            -configure -clientopts -setvncpw -vncpw Mypassword123!

      - name: Start Tunnel (Localhost.run)
        run: |
          # Use localhost.run for TCP tunneling
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 5900:localhost:5900 nokey@localhost.run > tunnel.log 2>&1 &
          
          echo "Waiting for tunnel to start..."
          for i in {1..20}; do
            sleep 3
            if grep -q "tunneled with" tunnel.log; then
              echo "----------------------------------------------------------"
              echo "TUNNEL ESTABLISHED"
              # Extract hostname and port
              ADDRESS=$(grep -oE "[a-z0-9.-]+\.lhr\.(life|run)" tunnel.log | head -n 1)
              PORT=$(grep -oE "port [0-9]+" tunnel.log | awk '{print $2}' | head -n 1)
              echo "VNC Address: vnc://$ADDRESS:$PORT"
              echo "----------------------------------------------------------"
              break
            fi
            if [ $i -eq 20 ]; then
              echo "Could not detect tunnel address. Full log:"
              cat tunnel.log
            fi
          done

      - name: Keep session alive
        run: |
          # Keep the job alive for up to 60 minutes
          sleep 3600
