name: Interactive macOS 26 Session
on: [workflow_dispatch]

jobs:
  interactive:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Screen Sharing (VNC)
        run: |
          # Set a VNC password
          # Note: Using 'mypassword' as a placeholder. In a real scenario, consider using a secret.
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCLegacyConnectionsAllowed -bool true
          echo "mypassword" | sudo tee /etc/vncpasswd
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -restart -agent -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes \
            -configure -clientopts -setvncpw -vncpw mypassword

      - name: Install and launch ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          brew install ngrok/ngrok/ngrok
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          ngrok tcp 5900 --log=stdout &
          sleep 10
          # Print the public address
          curl -s http://localhost:4040/api/tunnels | python3 -c \
            "import sys,json; t=json.load(sys.stdin)['tunnels'][0]; print('VNC Address:', t['public_url'])"

      - name: Copy and launch your app
        run: |
          # If your app is in the repo and built:
          # open MyApp.app
          echo "App launch step placeholder. Upload or build your app here."
          
      - name: Keep session alive
        run: |
          # Keep the job alive for up to 60 minutes
          sleep 3600
