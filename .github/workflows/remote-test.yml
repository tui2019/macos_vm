name: Interactive macOS 26 Session
on: [workflow_dispatch]

jobs:
  interactive:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Screen Sharing (VNC)
        run: |
          # Set a password for the 'runner' user without needing the old one
          echo "mypassword" | sudo passwd runner
          
          # Enable Screen Sharing / Remote Management
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCLegacyConnectionsAllowed -bool true
          
          # Kickstart Remote Management
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -restart -agent -privs -all
          
          # Set a VNC-specific password (the legacy way, often more reliable in CI)
          echo "mypassword" | sudo tee /etc/vncpasswd
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes \
            -configure -clientopts -setvncpw -vncpw mypassword

      - name: Start Tunnel (Pinggy.io)
        run: |
          # Use pinggy.io for TCP tunneling over SSH (no install needed)
          # We'll run it in the background and pipe output to a file to find the URL
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R0:localhost:5900 qr@a.pinggy.io > tunnel.log 2>&1 &
          
          # Wait for the tunnel to establish and print the address
          echo "Waiting for tunnel to start..."
          for i in {1..10}; do
            sleep 2
            if grep -q "tcp://" tunnel.log; then
              grep "tcp://" tunnel.log | sed 's/.*\(tcp:\/\/.*\)/\1/' | awk '{print "VNC Address: " $1}'
              break
            fi
            if [ $i -eq 10 ]; then
              echo "Tunnel log output (first 20 lines):"
              head -n 20 tunnel.log
            fi
          done

      - name: Keep session alive
        run: |
          # Keep the job alive for up to 60 minutes
          sleep 3600
