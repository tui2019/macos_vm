name: Interactive macOS 26 Session
on: [workflow_dispatch]

jobs:
  interactive:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Screen Sharing (VNC)
        run: |
          # Set a password for the 'runner' user without needing the old one
          echo "mypassword" | sudo passwd runner
          
          # Enable Screen Sharing / Remote Management
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCLegacyConnectionsAllowed -bool true
          
          # Kickstart Remote Management
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -restart -agent -privs -all
          
          # Set a VNC-specific password (the legacy way, often more reliable in CI)
          echo "mypassword" | sudo tee /etc/vncpasswd
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes \
            -configure -clientopts -setvncpw -vncpw mypassword

      - name: Start Tunnel (Pinggy.io)
        run: |
          # Use pinggy.io for TCP tunneling over SSH
          # The 'qr@a.pinggy.io' user provides a QR code and link, 't@a.pinggy.io' is for TCP
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R0:localhost:5900 t@a.pinggy.io > tunnel.log 2>&1 &
          
          echo "Waiting for tunnel to start..."
          for i in {1..15}; do
            sleep 3
            if grep -q "a.pinggy.link" tunnel.log; then
              echo "----------------------------------------------------------"
              echo "TUNNEL ESTABLISHED"
              # Extract the link and port. Pinggy TCP links look like ran-dom.a.pinggy.link:PORT
              ADDRESS=$(grep -oE "[a-z0-9-]+\.a\.pinggy\.link:[0-9]+" tunnel.log | head -n 1)
              if [ -z "$ADDRESS" ]; then
                # Fallback: look for the "Allocated port" line if the full URL isn't clear
                PORT=$(grep "Allocated port" tunnel.log | awk '{print $3}')
                HOST=$(grep -oE "[a-z0-9-]+\.a\.pinggy\.link" tunnel.log | head -n 1)
                ADDRESS="$HOST:$PORT"
              fi
              echo "VNC Address: vnc://$ADDRESS"
              echo "----------------------------------------------------------"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "Could not detect tunnel address. Full log:"
              cat tunnel.log
            fi
          done

      - name: Keep session alive
        run: |
          # Keep the job alive for up to 60 minutes
          sleep 3600
